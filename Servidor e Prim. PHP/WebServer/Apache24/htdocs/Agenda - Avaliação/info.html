<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="public/css/Agenda.css" />
    <title>Agenda</title>
</head>

<body>

    <main>
        <div class="container">

            <!-- LADO ESQUERDO -->
            <div class="lado_esquerdo">

                <div class="overlay"></div> <!--Fundo com imagem e efeito escuro-->

                <div class="conteudo_esquerdo">

                    <img src="public/img/login.png" alt="Conecte-se">

                    <h1>Agenda<br>Eletrônica</h1>

                    <p>
                        Sua vida organizada,
                        seus contatos sempre à mão.
                    </p>

                </div>

            </div>

            <!-- LADO DIREITO -->
            <div class="lado_direito">

                <div class="formulario">

                    <h1>Bem vindo de volta!</h1>
                    <p>Entre com suas credenciais para acessar a conta</p>

                    <form>
                        <label>E-mail</label>
                        <input type="email" placeholder="seu@email.com">

                        <label>Senha</label>
                        <input type="password" placeholder="Digite sua senha">

                        <div class="opcoes">

                            <div class="lembrar">
                                <input type="checkbox" name="lembrar"><span>Lembrar-me</span>
                            </div>

                            <a href="#">Esqueceu sua senha?</a>

                        </div>

                        <input type="submit" value="Entrar">

                    <p class="cadastro">Não tem uma conta? <a href="app/views/cadastrar_usuario.php">Cadastre-se</a>
                    </p>

                    </form>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
